<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple, fast task tracker that runs entirely in your browser." />
  <meta name="theme-color" content="#6366f1" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%93%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="container header-inner">
      <h1 class="app-title">
        <span class="logo" aria-hidden="true">&#10003;</span>
        Task Tracker
      </h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        <span class="theme-icon" aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="card" aria-labelledby="add-task-heading">
      <h2 id="add-task-heading" class="visually-hidden">Add a new task</h2>
      <form id="task-form" class="task-form" autocomplete="off">
        <label for="task-input" class="visually-hidden">New task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="What needs to be done?"
          maxlength="200"
          required
          aria-required="true"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <section class="card" aria-labelledby="tasks-heading">
      <div class="tasks-header">
        <h2 id="tasks-heading" class="section-title">Tasks</h2>
        <span id="task-count" class="task-count" aria-live="polite">0 items</span>
      </div>

      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-label="Task list"></ul>

      <p id="empty-state" class="empty-state" hidden>
        No tasks here. Add one above to get started.
      </p>

      <div class="tasks-footer" id="tasks-footer" hidden>
        <button id="clear-completed" type="button" class="btn btn-ghost">
          Clear completed
        </button>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <small>Data is stored locally in your browser.</small>
    </div>
  </footer>

  <template id="task-item-template">
    <li class="task-item">
      <label class="checkbox-wrap">
        <input type="checkbox" class="task-toggle" />
        <span class="checkbox" aria-hidden="true"></span>
      </label>
      <span class="task-text"></span>
      <button type="button" class="task-delete" aria-label="Delete task">
        &times;
      </button>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
