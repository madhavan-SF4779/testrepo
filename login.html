<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to Task Tracker." />
  <meta name="theme-color" content="#6366f1" />
  <title>Sign in · Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%93%3C/text%3E%3C/svg%3E" />
</head>
<body class="login-body">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="app-header">
    <div class="container header-inner">
      <h1 class="app-title">
        <span class="logo" aria-hidden="true">&#10003;</span>
        Task Tracker
      </h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        <span class="theme-icon" aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </header>

  <main id="main" class="login-main">
    <section class="card login-card" aria-labelledby="login-heading">
      <div class="login-intro">
        <span class="login-badge" aria-hidden="true">&#128274;</span>
        <h2 id="login-heading" class="login-title">Welcome back</h2>
        <p class="login-subtitle">Sign in to continue to your tasks.</p>
      </div>

      <div
        id="form-alert"
        class="form-alert"
        role="alert"
        aria-live="assertive"
        hidden
      ></div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            required
            aria-required="true"
            aria-describedby="email-error"
          />
          <p id="email-error" class="field-error" hidden></p>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a class="link-small" href="#forgot">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              minlength="8"
              required
              aria-required="true"
              aria-describedby="password-error"
            />
            <button
              id="toggle-password"
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-pressed="false"
              title="Show password"
            >
              &#128065;
            </button>
          </div>
          <p id="password-error" class="field-error" hidden></p>
        </div>

        <label class="checkbox-wrap remember">
          <input type="checkbox" id="remember" name="remember" />
          <span class="checkbox" aria-hidden="true"></span>
          <span>Remember me on this device</span>
        </label>

        <button type="submit" class="btn btn-primary login-submit" id="submit-btn">
          Sign in
        </button>
      </form>

      <p class="login-footer-text">
        Don't have an account? <a class="link-small" href="#signup">Sign up</a>
      </p>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <small>Demo UI — no credentials leave your browser.</small>
    </div>
  </footer>

  <script src="login.js" defer></script>
</body>
</html>
