<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBoard — Task Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand"><span class="brand-logo">&#10003;</span> TaskBoard</div>
      <nav>
        <button class="nav-item active" data-view="all">&#9776; All Tasks <span class="badge" id="badge-all">0</span></button>
        <button class="nav-item" data-view="todo">&#9675; To Do <span class="badge" id="badge-todo">0</span></button>
        <button class="nav-item" data-view="inprogress">&#9684; In Progress <span class="badge" id="badge-inprogress">0</span></button>
        <button class="nav-item" data-view="done">&#9679; Done <span class="badge" id="badge-done">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="btn ghost" type="button" aria-label="Toggle theme">&#9790; Dark mode</button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn ghost menu-btn" type="button" aria-label="Open menu">&#9776;</button>
        <h1 id="view-title">Dashboard</h1>
        <button id="new-btn" class="btn primary" type="button">+ New Task</button>
      </header>

      <section class="controls" aria-label="Search and filters">
        <input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks" />
        <select id="filter-priority" aria-label="Filter by priority">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="sort" aria-label="Sort tasks">
          <option value="created">Newest first</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </section>

      <section class="stats" aria-label="Summary">
        <div class="stat"><span id="stat-total">0</span><small>Total</small></div>
        <div class="stat"><span id="stat-progress">0</span><small>Active</small></div>
        <div class="stat"><span id="stat-rate">0%</span><small>Completed</small></div>
      </section>

      <section class="board" id="board">
        <div class="column" data-status="todo">
          <h2>To Do <span class="count" id="count-todo">0</span></h2>
          <div class="cards" id="cards-todo"></div>
        </div>
        <div class="column" data-status="inprogress">
          <h2>In Progress <span class="count" id="count-inprogress">0</span></h2>
          <div class="cards" id="cards-inprogress"></div>
        </div>
        <div class="column" data-status="done">
          <h2>Done <span class="count" id="count-done">0</span></h2>
          <div class="cards" id="cards-done"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <h2 id="dialog-title">New Task</h2>
      <label>Title
        <input id="f-title" required maxlength="100" placeholder="What needs doing?" />
      </label>
      <label>Description
        <textarea id="f-desc" rows="3" maxlength="500" placeholder="Optional details"></textarea>
      </label>
      <div class="row">
        <label>Status
          <select id="f-status">
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label>Priority
          <select id="f-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>Due date
          <input id="f-due" type="date" />
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
